<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREW. | Contact & Location</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
  <div class="logo">BREW.</div>

  <input type="checkbox" id="menu-toggle">
  <label for="menu-toggle" class="hamburger">☰</label>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section class="contact-container">
        <div class="contact-info">
            <h1>Visit the Café</h1>
            <p>Grab a cup and stay a while. We’re located in the heart of the city.</p>
            
            <div class="details">
                <p><strong>Address:</strong> 123 Espresso Lane, Coffee City</p>
                <p><strong>Hours:</strong> Mon-Sun: 7am - 6pm</p>
                <p><strong>Phone:</strong> (44) 1234567890</p>
            </div>

            <div class="map-box">
                <p>Map Preview Goes Here</p>
            </div>
        </div>

        <div class="contact-form">
            <h2>Send us a Message</h2>
            <form action="#">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <select>
                    <option>General Inquiry</option>
                    <option>Catering/Events</option>
                    <option>Careers</option>
                </select>
                <textarea rows="5" placeholder="How can we help?"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>

</body>
</html>
